<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматная Академия — 50 Дебютов</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* ТЕМНАЯ ТЕМА (ПО УМОЛЧАНИЮ) */
    body { background-color: #121110; color: #f0e6d2; padding: 15px; transition: background 0.3s, color 0.3s; }
    .container { max-width: 900px; margin: 0 auto; position: relative; }
    
    header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
    header h1 { color: #e6c687; font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: #a89f91; font-size: 0.95rem; }
    
    .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; flex-wrap: wrap; }
    .top-btns-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-action { background: #2b2621; color: #e6c687; border: 1px solid #544738; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
    .btn-action:hover, .btn-action:active { background: #c5a059; color: #121110; }

    .theme-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; }

    .search-box { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #544738; background: #1c1916; color: #fff; font-size: 1rem; outline: none; }
    .search-box:focus { border-color: #c5a059; }
    .stats { margin-bottom: 15px; color: #c5a059; font-size: 0.9rem; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    
    .card { background: #1c1916; border: 1px solid #3d352b; border-radius: 8px; padding: 12px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; position: relative; }
    .card:active { transform: scale(0.98); }
    .card-top-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .card-title { color: #e6c687; font-size: 1rem; font-weight: bold; margin-bottom: 6px; }
    .card-moves { font-family: monospace; color: #c5a059; font-size: 0.85rem; word-break: break-word; }
    .card-indicators { font-size: 0.85rem; margin-top: 6px; color: #a89f91; }

    /* МОДАЛЬНЫЕ ОКНА */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
    .modal-content { background: #1c1916; padding: 20px; border-radius: 10px; border: 1px solid #c5a059; max-width: 440px; width: 100%; position: relative; text-align: center; max-height: 95vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 8px; right: 15px; font-size: 1.8rem; color: #a89f91; cursor: pointer; }
    .m-title { color: #e6c687; margin-bottom: 6px; text-align: left; padding-right: 20px; font-size: 1.2rem; }
    .m-moves { background: #11100f; padding: 8px 12px; border-radius: 6px; color: #c5a059; font-family: monospace; font-size: 0.9rem; border: 1px solid #3d352b; text-align: left; margin-bottom: 12px; }
    #board { width: 100%; max-width: 300px; margin: 0 auto 12px auto; border: 2px solid #544738; }
    
    .controls { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .btn-ctrl { background: #2b2621; color: #f0e6d2; border: 1px solid #544738; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-ctrl.active { background: #c5a059; color: #121110; font-weight: bold; }
    .btn-ctrl:active { background: #c5a059; color: #121110; }

    .export-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .btn-sm { font-size: 0.75rem; padding: 6px 8px; }

    /* БЛОК ПОЛЬЗОВАТЕЛЬСКИХ ДАННЫХ */
    .user-data { text-align: left; background: #25221e; padding: 12px; border-radius: 8px; border: 1px solid #3d352b; }
    .user-data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9rem; }
    .user-data label { cursor: pointer; display: flex; align-items: center; gap: 5px; color: #f0e6d2; }
    .user-data select { background: #11100f; color: #f0e6d2; border: 1px solid #544738; padding: 4px; border-radius: 4px; outline: none; }
    .user-data textarea { width: 100%; background: #11100f; color: #f0e6d2; border: 1px solid #544738; padding: 8px; border-radius: 6px; min-height: 60px; resize: vertical; outline: none; font-size: 0.85rem; }
    .user-data textarea:focus { border-color: #c5a059; }

    /* ВИКТОРИНА */
    .quiz-q { font-size: 1rem; color: #e6c687; margin-bottom: 12px; text-align: left; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .quiz-opt-btn { background: #25221e; color: #f0e6d2; border: 1px solid #3d352b; padding: 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .quiz-opt-btn:hover { background: #3d352b; border-color: #c5a059; }
    .quiz-results { text-align: left; }
    .quiz-rec-item { background: #11100f; border: 1px solid #3d352b; padding: 8px 10px; margin-top: 6px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

    /* СВЕТЛАЯ ТЕМА */
    body.light-theme { background-color: #f5f6fa; color: #2f3640; }
    .light-theme .card, .light-theme .search-box, .light-theme .modal-content, .light-theme .quiz-opt-btn { background: #ffffff; border-color: #dcdde1; color: #2f3640; }
    .light-theme .search-box, .light-theme .search-box:focus { color: #2f3640; }
    .light-theme .m-moves, .light-theme .user-data textarea, .light-theme .user-data select, .light-theme .quiz-rec-item { background: #f0f2f5; color: #2f3640; border-color: #dcdde1; }
    .light-theme .btn-ctrl, .light-theme .user-data, .light-theme .btn-action { background: #e8eaed; color: #2f3640; border-color: #dcdde1; }
    .light-theme header h1, .light-theme .card-title, .light-theme .m-title, .light-theme .quiz-q { color: #192a56; }
    .light-theme header p, .light-theme .close-btn, .light-theme .card-top-info { color: #7f8fa6; }
    .light-theme .card-moves { color: #c23616; }
    .light-theme .user-data label { color: #2f3640; }
    .light-theme .stats { color: #e1b12c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <div class="top-btns-group">
        <button class="btn-action" onclick="openQuiz()">🧩 Викторина "Мой Дебют"</button>
        <button class="btn-action" onclick="openDataModal()">💾 Данные (Резерв)</button>
      </div>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Сменить тему">☀️</button>
    </div>

    <header>
      <h1>Шахматная Академия</h1>
      <p>50 интерактивных дебютов: озвучка, заметки и экспорт</p>
    </header>

    <input type="text" id="search" class="search-box" placeholder="🔍 Поиск дебюта..." oninput="filterOpenings()">
    <div class="stats" id="count-info">Найдено: 50</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЕБЮТА -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="m-title" class="m-title"></h2>
      <div id="m-moves" class="m-moves"></div>
      <div id="board"></div>
      
      <div class="controls">
        <button class="btn-ctrl" onclick="prevMove()">◄ Назад</button>
        <button class="btn-ctrl" onclick="togglePlay()" id="play-btn">▶ Авто</button>
        <button class="btn-ctrl" onclick="nextMove()">Вперёд ►</button>
        <button class="btn-ctrl" id="voice-btn" onclick="toggleVoice()">🔊 Голос: Выкл</button>
      </div>

      <!-- ЭКСПОРТ -->
      <div class="export-row">
        <button class="btn-ctrl btn-sm" onclick="exportLichess()">🌐 В Lichess</button>
        <button class="btn-ctrl btn-sm" onclick="copyPGN()">📋 PGN для Chess.com</button>
        <button class="btn-ctrl btn-sm" onclick="downloadPGN()">📥 Скачать PGN</button>
      </div>

      <!-- ЗАМЕТКИ И ПРОГРЕСС -->
      <div class="user-data">
        <div class="user-data-row">
          <label>
            <input type="checkbox" id="m-checkbox" onchange="saveUserData('completed', this.checked)">
            ✅ Выучено
          </label>
          <label>
            Оценка:
            <select id="m-rating" onchange="saveUserData('rating', this.value)">
              <option value="">-</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
              <option value="7">7</option><option value="8">8</option><option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>
        </div>
        <textarea id="m-notes" placeholder="Заметки, важные идеи или план реализации..." oninput="saveUserData('notes', this.value)"></textarea>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ВИКТОРИНЫ -->
  <div class="modal" id="quiz-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeQuiz()">&times;</span>
      <h2 class="m-title">🧩 Какой дебют вам подходит?</h2>
      <div id="quiz-body"></div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ЭКСПОРТА/ИМПОРТА ДАННЫХ -->
  <div class="modal" id="data-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeDataModal()">&times;</span>
      <h2 class="m-title">💾 Управление данными</h2>
      <p style="font-size:0.85rem; color:#888; margin-bottom:15px; text-align:left;">Сохраните ваши заметки, галочки и оценки в файл или перенесите их на новое устройство.</p>
      <div class="controls" style="flex-direction:column; gap:10px;">
        <button class="btn-ctrl" onclick="exportUserDataJSON()">📥 Экспортировать данные (.json)</button>
        <button class="btn-ctrl" onclick="document.getElementById('import-file').click()">📤 Импортировать данные (.json)</button>
        <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importUserDataJSON(event)">
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    const database = [
      { id: 1, title: "Итальянская партия", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4", style: "attack", side: "white" },
      { id: 2, title: "Испанская партия", moves: ["e4", "e5", "Nf3", "Nc6", "Bb5"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5", style: "pos", side: "white" },
      { id: 3, title: "Шотландская партия", moves: ["e4", "e5", "Nf3", "Nc6", "d4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. d4", style: "attack", side: "white" },
      { id: 4, title: "Защита Петрова", moves: ["e4", "e5", "Nf3", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nf6", style: "pos", side: "black" },
      { id: 5, title: "Защита Филидора", moves: ["e4", "e5", "Nf3", "d6"], pgn: "1. e4 e5 2. Nf3 d6", style: "pos", side: "black" },
      { id: 6, title: "Защита двух коней", moves: ["e4", "e5", "Nf3", "Nc6", "Bc4", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6", style: "counter", side: "black" },
      { id: 7, title: "Дебют четырех коней", moves: ["e4", "e5", "Nf3", "Nc6", "Nc3", "Nf6"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6", style: "pos", side: "white" },
      { id: 8, title: "Королевский гамбит", moves: ["e4", "e5", "f4"], pgn: "1. e4 e5 2. f4", style: "attack", side: "white" },

      { id: 10, title: "Детский мат", moves: ["e4", "e5", "Qh5", "Nc6", "Bc4", "Nf6", "Qxf7#"], pgn: "1. e4 e5 2. Qh5 Nc6 3. Bc4 Nf6 4. Qxf7#", style: "attack", side: "white" },

      { id: 12, title: "Центральный дебют", moves: ["e4", "e5", "d4", "exd4", "Qxd4"], pgn: "1. e4 e5 2. d4 exd4 3. Qxd4", style: "attack", side: "white" },

      { id: 15, title: "Защита Каро-Канн", moves: ["e4", "c6", "d4", "d5"], pgn: "1. e4 c6 2. d4 d5", style: "pos", side: "black" },

      { id: 17, title: "Скандинавская защита", moves: ["e4", "d5"], pgn: "1. e4 d5", style: "counter", side: "black" },
      { id: 18, title: "Защита Алехина", moves: ["e4", "Nf6"], pgn: "1. e4 Nf6", style: "counter", side: "black" },
      { id: 19, title: "Защита Нимцовича", moves: ["e4", "Nc6"], pgn: "1. e4 Nc6", style: "counter", side: "black" },
      { id: 20, title: "Сицилианская: Вариант Дракона", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "g6"], pgn: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 g6", style: "attack", side: "black" },
      { id: 21, title: "Сицилианская: Вариант Найдорфа", moves: ["e4", "c5", "Nf3", "d6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "a6"], pgn: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 a6", style: "counter", side: "black" },
      { id: 22, title: "Сицилианская: Челябинский вариант", moves: ["e4", "c5", "Nf3", "Nc6", "d4", "cxd4", "Nxd4", "Nf6", "Nc3", "e5"], pgn: "1. e4 c5 2. Nf3 Nc6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3 e5", style: "counter", side: "black" },
      { id: 23, title: "Ферзевый гамбит", moves: ["d4", "d5", "c4"], pgn: "1. d4 d5 2. c4", style: "pos", side: "white" },
      { id: 24, title: "Принятый ферзевый гамбит", moves: ["d4", "d5", "c4", "dxc4"], pgn: "1. d4 d5 2. c4 dxc4", style: "pos", side: "black" },
      { id: 25, title: "Отказанный ферзевый гамбит", moves: ["d4", "d5", "c4", "e6"], pgn: "1. d4 d5 2. c4 e6", style: "pos", side: "black" },
      { id: 26, title: "Славянская защита", moves: ["d4", "d5", "c4", "c6"], pgn: "1. d4 d5 2. c4 c6", style: "pos", side: "black" },
      { id: 27, title: "Лондонская система", moves: ["d4", "d5", "Nf3", "Nf6", "Bf4"], pgn: "1. d4 d5 2. Nf3 Nf6 3. Bf4", style: "pos", side: "white" },
      { id: 28, title: "Дебют Тромповского", moves: ["d4", "Nf6", "Bg5"], pgn: "1. d4 Nf6 2. Bg5", style: "attack", side: "white" },

      { id: 35, title: "Защита Бенони", moves: ["d4", "Nf6", "c4", "c5", "d5"], pgn: "1. d4 Nf6 2. c4 c5 3. d5", style: "counter", side: "black" },
      { id: 36, title: "Волжский гамбит (Бенко)", moves: ["d4", "Nf6", "c4", "c5", "d5", "b5"], pgn: "1. d4 Nf6 2. c4 c5 3. d5 b5", style: "counter", side: "black" },
      { id: 37, title: "Голландская защита", moves: ["d4", "f5"], pgn: "1. d4 f5", style: "attack", side: "black" },
      { id: 38, title: "Будапештский гамбит", moves: ["d4", "Nf6", "c4", "e5"], pgn: "1. d4 Nf6 2. c4 e5", style: "counter", side: "black" },

      { id: 40, title: "Дебют Рети", moves: ["Nf3", "d5", "c4"], pgn: "1. Nf3 d5 2. c4", style: "pos", side: "white" },
      { id: 41, title: "Староиндийское начало", moves: ["Nf3", "d5", "g3", "Nf6", "Bg2"], pgn: "1. Nf3 d5 2. g3 Nf6 3. Bg2", style: "pos", side: "white" },
      { id: 42, title: "Дебют Бёрда", moves: ["f4"], pgn: "1. f4", style: "attack", side: "white" },
      { id: 43, title: "Дебют Ларсена", moves: ["b3"], pgn: "1. b3", style: "pos", side: "white" },
      { id: 44, title: "Дебют Сокольского", moves: ["b4"], pgn: "1. b4", style: "attack", side: "white" },
      { id: 45, title: "Дебют Гроба", moves: ["g4"], pgn: "1. g4", style: "attack", side: "white" },
      { id: 46, title: "Северный (Датский) гамбит", moves: ["e4", "e5", "d4", "exd4", "c3"], pgn: "1. e4 e5 2. d4 exd4 3. c3", style: "attack", side: "white" },
      { id: 47, title: "Шотландский гамбит", moves: ["e4", "e5", "Nf3", "Nc6", "d4", "exd4", "Bc4"], pgn: "1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Bc4", style: "attack", side: "white" },
      { id: 48, title: "Гамбит Блэкмар-Димера", moves: ["d4", "d5", "e4", "dxe4", "Nc3"], pgn: "1. d4 d5 2. e4 dxe4 3. Nc3", style: "attack", side: "white" },
      { id: 49, title: "Гамбит Хэллоуин", moves: ["e4", "e5", "Nf3", "Nc6", "Nc3", "Nf6", "Nxe5"], pgn: "1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6 4. Nxe5", style: "attack", side: "white" },
      { id: 50, title: "Защита Святого Георгия", moves: ["e4", "a6"], pgn: "1. e4 a6", style: "counter", side: "black" }
    ];

    let userProgress = JSON.parse(localStorage.getItem('chessProgress')) || {};
    let isLight = localStorage.getItem('chessTheme') === 'light';
    let voiceEnabled = false;

    if (isLight) {
      document.body.classList.add('light-theme');
      document.getElementById('theme-btn').textContent = '🌙';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const lightNow = document.body.classList.contains('light-theme');
      localStorage.setItem('chessTheme', lightNow ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = lightNow ? '🌙' : '☀️';
    }

    let board = null;
    let game = new Chess();
    let currentItem = null;
    let currentMoves = [];
    let moveIdx = 0;
    let autoPlayTimer = null;

    // ЗВУК ДВИЖЕНИЯ ФИГУРЫ (Web Audio)
    function playMoveSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch(e) {}
    }

    // ИИ-ГОЛОС ДЛЯ СЛЕПЫХ ИЛИ СЛУХОВОГО ВОСПРИЯТИЯ
    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('voice-btn');
      btn.textContent = voiceEnabled ? '🔊 Голос: Вкл' : '🔊 Голос: Выкл';
      btn.classList.toggle('active', voiceEnabled);
    }

    function speakMove(moveStr) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      let spoken = moveStr
        .replace(/N/g, 'Конь ')
        .replace(/B/g, 'Слон ')
        .replace(/R/g, 'Ладья ')
        .replace(/Q/g, 'Ферзь ')
        .replace(/K/g, 'Король ')
        .replace(/x/g, ' берёт ')
        .replace(/\+/g, ' шах')
        .replace(/#/g, ' мат');
      
      let utter = new SpeechSynthesisUtterance(spoken);
      utter.lang = 'ru-RU';
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function render(items) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('count-info').textContent = `Найдено: ${items.length}`;

      items.forEach(item => {
        const data = userProgress[item.id] || {};
        const checkIcon = data.completed ? '✅ Выучено' : '';
        const ratingIcon = data.rating ? `⭐ ${data.rating}/10` : '';
        const noteIcon = data.notes && data.notes.trim() !== '' ? '📝' : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div class="card-top-info">
            <span>#${item.id}</span>
            <span>${ratingIcon}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-moves">${item.pgn}</div>
          <div class="card-indicators">${checkIcon} ${noteIcon}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      currentItem = item;
      document.getElementById('m-title').textContent = `#${item.id} ${item.title}`;
      document.getElementById('m-moves').textContent = item.pgn;
      
      const data = userProgress[item.id] || {};
      document.getElementById('m-checkbox').checked = data.completed || false;
      document.getElementById('m-rating').value = data.rating || '';
      document.getElementById('m-notes').value = data.notes || '';

      document.getElementById('modal').style.display = 'flex';

      game.reset();
      currentMoves = item.moves;
      moveIdx = 0;

      if (!board) {
        board = Chessboard('board', {
          position: 'start',
          pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
      } else {
        board.position('start');
      }
    }

    function saveUserData(key, value) {
      if (!currentItem) return;
      if (!userProgress[currentItem.id]) userProgress[currentItem.id] = {};
      userProgress[currentItem.id][key] = value;
      localStorage.setItem('chessProgress', JSON.stringify(userProgress));
    }

    function nextMove() {
      if (moveIdx < currentMoves.length) {
        const m = currentMoves[moveIdx];
        game.move(m);
        board.position(game.fen());
        moveIdx++;
        playMoveSound();
        speakMove(m);
      } else {
        stopAutoPlay();
      }
    }

    function prevMove() {
      if (moveIdx > 0) {
        game.undo();
        board.position(game.fen());
        moveIdx--;
        playMoveSound();
      }
    }

    function togglePlay() {
      if (autoPlayTimer) {
        stopAutoPlay();
      } else {
        document.getElementById('play-btn').textContent = '⏸ Пауза';
        autoPlayTimer = setInterval(() => {
          if (moveIdx < currentMoves.length) {
            nextMove();
          } else {
            stopAutoPlay();
          }
        }, 1000);
      }
    }

    function stopAutoPlay() {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      document.getElementById('play-btn').textContent = '▶ Авто';
    }

    function closeModal() {
      stopAutoPlay();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('modal').style.display = 'none';
      filterOpenings();
    }

    function filterOpenings() {
      const q = document.getElementById('search').value.toLowerCase();
      render(database.filter(i => i.title.toLowerCase().includes(q) || i.pgn.toLowerCase().includes(q)));
    }

    /* ЭКСПОРТ И ИМПОРТ */
    function exportLichess() {
      if (!currentItem) return;
      const lichessUrl = `https://lichess.org/analysis/pgn/${encodeURIComponent(currentItem.pgn)}`;
      window.open(lichessUrl, '_blank');
    }

    function copyPGN() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.pgn).then(() => {
        alert('PGN скопирован! Вы можете вставить его в Анализ на Chess.com или Lichess.');
      });
    }

    function downloadPGN() {
      if (!currentItem) return;
      const blob = new Blob([currentItem.pgn], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${currentItem.title}.pgn`;
      a.click();
    }

    function openDataModal() { document.getElementById('data-modal').style.display = 'flex'; }
    function closeDataModal() { document.getElementById('data-modal').style.display = 'none'; }

    function exportUserDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userProgress));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "chess_academy_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importUserDataJSON(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          userProgress = JSON.parse(e.target.result);
          localStorage.setItem('chessProgress', JSON.stringify(userProgress));
          alert('Данные успешно импортированы!');
          closeDataModal();
          filterOpenings();
        } catch(err) {
          alert('Ошибка при чтении файла');
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }

    /* ВИКТОРИНА «КАКОЙ ДЕБЮТ ВАМ ПОДХОДИТ?» */
    let quizStep = 0;
    let quizAnswers = {};

    function openQuiz() {
      quizStep = 0;
      quizAnswers = {};
      document.getElementById('quiz-modal').style.display = 'flex';
      renderQuizStep();
    }

    function closeQuiz() {
      document.getElementById('quiz-modal').style.display = 'none';
    }

    function renderQuizStep() {
      const body = document.getElementById('quiz-body');
      if (quizStep === 0) {
        body.innerHTML = `
          <div class="quiz-q">1. За какой цвет вы хотите выстроить свой основной репертуар?</div>
          <div class="quiz-options">
            <button class="quiz-opt-btn" onclick="answerQuiz('side', 'white')">⚪ Белые (Атаковать с 1-го хода)</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('side', 'black')">⚫ Черные (Контратаковать и отвечать)</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('side', 'any')">🌗 Всё равно (Ищу универсальный стиль)</button>
          </div>
        `;
      } else if (quizStep === 1) {
        body.innerHTML = `
          <div class="quiz-q">2. Какой подход вам ближе всего в партии?</div>
          <div class="quiz-options">
            <button class="quiz-opt-btn" onclick="answerQuiz('style', 'attack')">⚔️ Агрессивная атака на короля и быстрая развивка</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('style', 'pos')">🛡️ Прочная позиция, стратегический контроль и надежность</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('style', 'counter')">⚡ Контратака, гамбиты и хитрые ловушки</button>
          </div>
        `;
      } else if (quizStep === 2) {
        body.innerHTML = `
          <div class="quiz-q">3. Как вы относитесь к риску и жертвам пешек?</div>
          <div class="quiz-options">
            <button class="quiz-opt-btn" onclick="answerQuiz('risk', 'high')">🔥 Обожаю жертвовать ради инициативы!</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('risk', 'med')">⚖️ Рискую только если вариант тщательно просчитан</button>
            <button class="quiz-opt-btn" onclick="answerQuiz('risk', 'low')">🧱 Предпочитаю надёжную защиту без лишнего риска</button>
          </div>
        `;
      } else {
        // РАСЧЕТ РЕКОМЕНДАЦИЙ
        let matched = database.filter(item => {
          let sideMatch = quizAnswers.side === 'any' || item.side === quizAnswers.side;
          let styleMatch = item.style === quizAnswers.style;
          return sideMatch && styleMatch;
        });

        if (matched.length === 0) {
          matched = database.filter(item => item.style === quizAnswers.style).slice(0, 4);
        } else {
          matched = matched.slice(0, 5);
        }

        let styleName = quizAnswers.style === 'attack' ? 'Атакующий гроссмейстер' : (quizAnswers.style === 'pos' ? 'Стратег-позиционник' : 'Мастер контратаки и гамбитов');

        let recsHTML = matched.map(m => `
          <div class="quiz-rec-item">
            <div>
              <strong>#${m.id} ${m.title}</strong>
              <div style="font-size:0.75rem; color:#888;">${m.pgn}</div>
            </div>
            <button class="btn-ctrl btn-sm" onclick="closeQuiz(); openModal(database[${m.id - 1}]);">Открыть</button>
          </div>
        `).join('');

        body.innerHTML = `
          <div class="quiz-results">
            <div style="font-size:0.9rem; color:#c5a059; margin-bottom:10px;">Ваш тип игры: <strong>${styleName}</strong></div>
            <p style="font-size:0.85rem; margin-bottom:10px;">Вот идеальные варианты для вашего стиля:</p>
            ${recsHTML}
            <button class="btn-ctrl" style="margin-top:15px; width:100%;" onclick="openQuiz()">🔄 Пройти тест заново</button>
          </div>
        `;
      }
    }

    function answerQuiz(key, val) {
      quizAnswers[key] = val;
      quizStep++;
      renderQuizStep();
    }

    render(database);
  </script>
<script>
/* Stockfish для «Шахматной Академии»: шкала оценки, анализ и игра с компьютером.
   Вставьте ПОСЛЕ основного <script>, прямо перед </body>.
   Существующий код сайта, доска и фигуры не изменяются. */
(function () {
  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
  var PIECE = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';
  var LEVELS = { 1: { s: 1, t: 300 }, 2: { s: 6, t: 500 }, 3: { s: 12, t: 800 }, 4: { s: 20, t: 1200 } };

  var engine = null, ready = false, searching = false, job = null, pending = null;
  var analysisOn = false, playMode = false, userColor = 'w', resetFlag = false;

  /* ---------- Интерфейс (добавляется под доской) ---------- */
  var css = document.createElement('style');
  css.textContent =
    '.eng-box{margin:0 auto 12px auto;max-width:300px;text-align:left}' +
    '.eng-bar{position:relative;height:22px;background:#3a3a3a;border:1px solid #544738;border-radius:6px;overflow:hidden;margin-bottom:8px}' +
    '.eng-white{position:absolute;left:0;top:0;bottom:0;width:50%;background:#f0e6d2;transition:width .3s}' +
    '.eng-val{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:bold;color:#fff;mix-blend-mode:difference}' +
    '.eng-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}' +
    '.eng-row select{background:#11100f;color:#f0e6d2;border:1px solid #544738;padding:5px;border-radius:6px;font-size:.75rem}' +
    '.eng-status{font-size:.8rem;color:#a89f91;text-align:center;min-height:1.1em}' +
    '.light-theme .eng-row select{background:#f0f2f5;color:#2f3640;border-color:#dcdde1}';
  document.head.appendChild(css);

  var box = document.createElement('div');
  box.className = 'eng-box';
  box.innerHTML =
    '<div class="eng-bar"><div class="eng-white" id="eng-white"></div><span class="eng-val" id="eng-val">0.0</span></div>' +
    '<div class="eng-row">' +
      '<button class="btn-ctrl btn-sm" id="eng-an-btn">🧠 Анализ: Выкл</button>' +
      '<button class="btn-ctrl btn-sm" id="eng-play-btn">🤖 Игра с компьютером</button>' +
    '</div>' +
    '<div class="eng-row">' +
      '<select id="eng-color"><option value="w">Я за белых</option><option value="b">Я за чёрных</option></select>' +
      '<select id="eng-level"><option value="1">Новичок</option><option value="2" selected>Любитель</option><option value="3">Клубный</option><option value="4">Сильный</option></select>' +
    '</div>' +
    '<div class="eng-status" id="eng-status">Движок: выключен</div>';
  document.getElementById('board').insertAdjacentElement('afterend', box);
  document.getElementById('eng-an-btn').onclick = toggleAnalysis;
  document.getElementById('eng-play-btn').onclick = togglePlayVsComputer;

  function $(id) { return document.getElementById(id); }
  function setStatus(t) { $('eng-status').textContent = t; }

  /* ---------- Шкала оценки ---------- */
  function setEval(cp, mate) {
    var pct, txt;
    if (mate !== null) {
      pct = mate > 0 ? 100 : 0;
      txt = (mate > 0 ? '+' : '-') + 'M' + Math.abs(mate);
    } else {
      pct = 50 + 50 * (2 / (1 + Math.exp(-cp / 400)) - 1);
      txt = (cp > 0 ? '+' : '') + (cp / 100).toFixed(1);
    }
    $('eng-white').style.width = pct + '%';
    $('eng-val').textContent = txt;
  }

  /* ---------- Движок (Web Worker через Blob) ---------- */
  function send(c) { if (engine) engine.postMessage(c); }

  function startEngine() {
    if (engine) return;
    setStatus('Движок загружается…');
    try {
      var blob = new Blob(["importScripts('" + CDN + "');"], { type: 'application/javascript' });
      engine = new Worker(URL.createObjectURL(blob));
    } catch (e) {
      engine = null;
      setStatus('Этот браузер не поддерживает движок');
      return;
    }
    engine.onmessage = onEngineMsg;
    engine.onerror = function () {
      engine = null; ready = false; searching = false; job = null;
      setStatus('Не удалось загрузить движок (нужен интернет)');
    };
    send('uci');
  }

  function onEngineMsg(e) {
    var l = typeof e.data === 'string' ? e.data : String(e.data);
    if (l === 'uciok') { send('isready'); return; }
    if (l === 'readyok') {
      ready = true;
      setStatus(playMode ? 'Ваш ход' : 'Движок готов');
      if (pending) { var j = pending; pending = null; start(j); }
      return;
    }
    if (l.indexOf('info') === 0) {
      if (!job || pending) return;
      var m = /score (cp|mate) (-?\d+)/.exec(l);
      if (!m || l.indexOf('bound') > -1) return;
      var v = parseInt(m[2], 10) * (job.turn === 'w' ? 1 : -1);
      if (m[1] === 'cp') setEval(v, null); else setEval(0, v);
      return;
    }
    if (l.indexOf('bestmove') === 0) {
      searching = false;
      var done = job; job = null;
      if (pending) { var j2 = pending; pending = null; start(j2); return; }
      if (done && done.kind === 'play') engineMove(l.split(' ')[1], done.fen);
    }
  }

  function start(j) {
    job = j; searching = true;
    var L = LEVELS[$('eng-level').value] || LEVELS[2];
    if (j.kind === 'play') send('setoption name Skill Level value ' + L.s);
    send('position fen ' + j.fen);
    send(j.kind === 'play' ? 'go movetime ' + L.t : 'go depth 12');
  }

  function run(j) {
    if (!engine || !ready) { pending = j; return; }
    if (searching) { pending = j; send('stop'); return; }
    start(j);
  }

  function stopSearch() { pending = null; if (engine && searching) send('stop'); }

  function evalNow() {
    if (!analysisOn && !playMode) return;
    startEngine();
    run({ kind: 'eval', fen: game.fen(), turn: game.turn() });
  }

  /* ---------- Анализ ---------- */
  function toggleAnalysis() {
    analysisOn = !analysisOn;
    $('eng-an-btn').textContent = analysisOn ? '🧠 Анализ: Вкл' : '🧠 Анализ: Выкл';
    $('eng-an-btn').classList.toggle('active', analysisOn);
    if (analysisOn) { startEngine(); evalNow(); }
    else if (!playMode) { stopSearch(); setStatus('Движок: выключен'); }
  }

  /* ---------- Игра с компьютером ---------- */
  function makeBoard(fen, orient, drag) {
    if (board && board.destroy) board.destroy();
    var cfg = { position: fen, orientation: orient, pieceTheme: PIECE };
    if (drag) {
      cfg.draggable = true;
      cfg.onDragStart = onDragStart;
      cfg.onDrop = onDrop;
      cfg.onSnapEnd = function () { board.position(game.fen()); };
    }
    board = Chessboard('board', cfg);
  }

  function onDragStart(source, piece) {
    if (!playMode || game.game_over() || game.turn() !== userColor) return false;
    if (piece[0] !== userColor) return false;
  }

  function onDrop(from, to) {
    var m = game.move({ from: from, to: to, promotion: 'q' });
    if (m === null) return 'snapback';
    playMoveSound(); speakMove(m.san);
    if (checkEnd()) return;
    setStatus('Компьютер думает…');
    run({ kind: 'play', fen: game.fen(), turn: game.turn() });
  }

  function engineMove(mv, fen) {
    if (!playMode || game.fen() !== fen) return;
    if (!mv || mv === '(none)') { checkEnd(); return; }
    var r = game.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] || 'q' });
    if (!r) return;
    board.position(game.fen());
    playMoveSound(); speakMove(r.san);
    if (!checkEnd()) { setStatus('Ваш ход'); evalNow(); }
  }

  function checkEnd() {
    if (!game.game_over()) return false;
    setStatus(game.in_checkmate() ? 'Мат! ' + (game.turn() === 'w' ? 'Победили чёрные' : 'Победили белые') : 'Ничья');
    return true;
  }

  function togglePlayVsComputer() {
    if (playMode) { exitPlay(false); return; }
    stopAutoPlay();
    userColor = $('eng-color').value;
    playMode = true;
    $('eng-play-btn').textContent = '⏹ Выйти из игры';
    makeBoard(game.fen(), userColor === 'w' ? 'white' : 'black', true);
    startEngine();
    if (checkEnd()) return;
    if (game.turn() !== userColor) {
      setStatus('Компьютер думает…');
      run({ kind: 'play', fen: game.fen(), turn: game.turn() });
    } else {
      setStatus('Ваш ход');
      evalNow();
    }
  }

  function exitPlay(fromClose) {
    playMode = false;
    stopSearch();
    $('eng-play-btn').textContent = '🤖 Игра с компьютером';
    game.reset(); moveIdx = 0;
    if (fromClose) resetFlag = true; else makeBoard('start', 'white', false);
    setEval(0, null);
    setStatus(analysisOn ? 'Движок готов' : 'Движок: выключен');
    if (!fromClose) evalNow();
  }

  /* ---------- Подключение к существующим функциям (их код не меняется) ---------- */
  var _next = window.nextMove, _prev = window.prevMove, _open = window.openModal, _close = window.closeModal;

  window.nextMove = function () { if (playMode) return; _next(); evalNow(); };
  window.prevMove = function () { if (playMode) return; _prev(); evalNow(); };
  window.openModal = function (item) {
    _open(item);
    if (resetFlag) { makeBoard('start', 'white', false); resetFlag = false; }
    setEval(0, null);
    evalNow();
  };
  window.closeModal = function () {
    if (playMode) exitPlay(true);
    stopSearch();
    _close();
  };
})();
</script>
